<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wellness by Mom</title>

    <!-- CSS LINK (IMPORTANT) -->
    
</head>
<style>
body {
    font-family: 'Arial', sans-serif;
    margin: 0;
    padding: 0;
    background-color: #FFF8F3;
    color: #4E342E;
}

.hero {
    background-color: #F7C8A0;
    text-align: center;
    padding: 70px 20px;
}

.hero-text h1 {
    font-size: 40px;
}

.btn {
    background-color: #D97D54;
    color: white;
    padding: 10px 20px;
    border-radius: 20px;
    text-decoration: none;
    margin: 5px;
    display: inline-block;
}

.btn.secondary {
    background-color: #F4D6CC;
    color: #4E342E;
}

.section {
    padding: 50px 20px;
    text-align: center;
}

.products {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 20px;
}

.product {
    background: #FFF3E0;
    padding: 15px;
    border-radius: 12px;
}

.product img {
    width: 100%;
    border-radius: 10px;
}

.contact-box {
    background: #F4D6CC;
    padding: 20px;
    border-radius: 10px;
    max-width: 300px;
    margin: auto;
}
</style>
